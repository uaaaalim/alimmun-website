services:
  website:
    image: ghcr.io/uaaaalim/alimmun-website:latest
    restart: unless-stopped

    env_file:
      - path: .env.production
        required: false

    networks:
      proxy:
        aliases:
          - alimmun-website

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true